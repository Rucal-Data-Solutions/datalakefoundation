name: Scala CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - '*.sbt'
      - 'version.properties'
      - 'project/**'
      - '.scalafmt.conf'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - '*.sbt'
      - 'version.properties'
      - 'project/**'
      - '.scalafmt.conf'
      - '.github/workflows/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        java: [17]

    runs-on: ${{matrix.os}}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: ${{matrix.java}}
        distribution: 'temurin'
        cache: 'sbt'

    - name: Setup sbt launcher
      uses: sbt/setup-sbt@v1

    - name: Build and tests
      run: sbt + test

    - name: Sbt Dependency Submission
      uses: scalacenter/sbt-dependency-submission@v2.2.2

  version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Read version
      id: version
      run: |
        version=$(sed -n 's/^VERSION=//p' version.properties | tr -d '[:space:]')
        echo "version=$version" >> "$GITHUB_OUTPUT"
        if git rev-parse -q --verify "refs/tags/v${version}" > /dev/null; then
          echo "released=true" >> "$GITHUB_OUTPUT"
        else
          echo "released=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Delete previous version comment
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" \
          --jq '.[] | select(.body | startswith("<!-- version-check -->")) | .id' \
        | while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/issues/comments/$id"
          done

    - name: Comment on PR
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.version.outputs.version }}
        RELEASED: ${{ steps.version.outputs.released }}
      run: |
        if [ "$RELEASED" = "true" ]; then
          status="**v${VERSION} is already released.** Bump \`VERSION\` in \`version.properties\` before the next stable release."
        else
          status="Next stable release: **v${VERSION}** (not released yet)."
        fi
        body="<!-- version-check -->"$'\n'"${status}"$'\n\n'"Merging only updates the **nightly** pre-release. A stable release is started manually via *Actions → Release*."
        gh pr comment "${{ github.event.number }}" --body "$body"

  nightly:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: nightly
      cancel-in-progress: true

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Compute nightly version
      id: version
      run: |
        base=$(sed -n 's/^VERSION=//p' version.properties | tr -d '[:space:]')
        version="${base}-nightly.$(date -u +%Y%m%d).${GITHUB_SHA::7}"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: 'sbt'

    - name: Setup sbt launcher
      uses: sbt/setup-sbt@v1

    - name: Build JAR
      env:
        DLF_VERSION: ${{ steps.version.outputs.version }}
      run: sbt +package

    # Rolling pre-release: never marked as latest, never published to Maven Central.
    - name: Update nightly pre-release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        gh release delete nightly --cleanup-tag --yes || true
        gh release create nightly \
          --prerelease \
          --latest=false \
          --target "$GITHUB_SHA" \
          --title "Nightly (v${VERSION})" \
          --notes "Untested nightly build of \`main\` at ${GITHUB_SHA}. Not for production use; not published to Maven Central." \
          target/scala-2.13/*.jar
